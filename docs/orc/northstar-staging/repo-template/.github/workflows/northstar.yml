name: northstar
# 省 Actions 分钟数：只在指向 main 的 PR 上跑；同一个 PR 有新推送时取消还没跑完的旧运行。
# 不要加 paths 过滤：这是 required check，被过滤掉时检查一直停在等待中，PR 合不进去。
on:
  pull_request:
    branches: [main]
    # 默认只有 opened / synchronize / reopened；加上 ready_for_review：草稿 PR 转正时隐藏考题要跑
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: northstar-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 防止卡住的运行一直耗分钟数；检查较慢的项目按需调大
    steps:
      # 检出 PR 本身的最新 commit，不用 GitHub 默认的合并引用：
      # 合并引用多出一个不带 [N#] 的合并 commit，也会让进度报告里的 commit 列表对不上
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      # 在这里补上本项目安装依赖的步骤，否则 CI 跑不通检查
      - name: 签名校验
        env: { SIGNERS: "${{ vars.NORTHSTAR_ALLOWED_SIGNERS }}" }
        run: |
          [ -d .northstar ] || exit 0
          printf '%s\n' "$SIGNERS" > /tmp/allowed_signers
          ssh-keygen -Y verify -f /tmp/allowed_signers -I linhan -n northstar \
            -s .northstar/MANIFEST.sig < .northstar/MANIFEST
          diff <(find .northstar -type f ! -name MANIFEST ! -name MANIFEST.sig -print0 \
            | LC_ALL=C sort -z | xargs -0 shasum -a 256) .northstar/MANIFEST
      - name: 验收检查
        run: "[ ! -f .northstar/checks/run_all.sh ] || bash .northstar/checks/run_all.sh"
      - name: 进度报告与代码一致
        run: |
          [ -f .northstar/architecture.json ] || exit 0
          # 只在有进度报告可查时运行：单个 mission 流程（northstar start 写的 ACTIVE）或者已经有报告。
          # orc 的流程没有这两样，进度由 orc 的状态页给出（proposals/2026-11-08-ci-progress-report-step.md）
          [ -f .northstar/missions/ACTIVE ] || [ -f status/status.json ] || exit 0
          cp status/status.json /tmp/claimed.json
          python3 .github/workflows/northstar_status.py
          diff <(jq -S . /tmp/claimed.json) <(jq -S . status/status.json)
      - name: commit 必须带 [N#]
        run: |
          [ -d .northstar ] || exit 0
          bad=$(git log --format=%s origin/${{ github.base_ref }}..HEAD \
            | grep -vE '^\[(N[0-9]+(,N[0-9]+)*|NS)\]' || true)
          [ -z "$bad" ] || { echo "缺少 [N#] 的 commit："; echo "$bad"; exit 1; }
  # 隐藏考题（PLAN 阶段 5，proposals/2026-11-08-phase5-open-points.md 第 3 条）
  # 考题放在 agent 的 token 访问不到的私有仓库（DaoBrewAI/LY_orchestrator-hub，没选进 agent token），
  # 路径 exams/<本仓库名>/run.sh；用只读这个仓库的 token（secret NORTHSTAR_EXAM_TOKEN）取。
  # 只报通过或失败：考题的输出一律丢掉（公开仓库的日志谁都能看）；运行时断网，被测代码发不出考题。
  exam:
    # 草稿 PR 不跑，省分钟数。跳过的 job 在 GitHub 上算 Success，但 orc 只认 pass，草稿过不了 orc 的验收
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.head.sha }}", path: product, persist-credentials: false }
      - name: 取考题
        uses: actions/checkout@v4
        with:
          repository: DaoBrewAI/LY_orchestrator-hub
          token: "${{ secrets.NORTHSTAR_EXAM_TOKEN }}"
          path: exam-repo
          persist-credentials: false
      - name: 只留本仓库的考题
        run: |
          src="exam-repo/exams/${{ github.event.repository.name }}"
          [ -f "$src/run.sh" ] || { echo "考题仓库里没有 exams/${{ github.event.repository.name }}/run.sh"; exit 1; }
          mv "$src" exam && rm -rf exam-repo
      # 在这里补上本项目安装依赖的步骤（考题运行时断网，依赖要先装好）
      - name: 运行考题（断网，只报通过或失败）
        run: |
          if sudo unshare --net -- sudo -u "$USER" env EXAM_DIR="$PWD/exam" HOME="$HOME" PATH="$PATH" \
               bash -c 'cd product && bash ../exam/run.sh' >/dev/null 2>&1; then
            echo "隐藏考题：通过"
          else
            echo "隐藏考题：没通过"; exit 1
          fi
