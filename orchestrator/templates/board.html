<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestrator — Missions</title>
<style>
  :root {
    --paper:#f7f8f6; --ink:#212a2e; --soft:#55636b; --line:#d8ddd8;
    --pine:#2e6157; --amber:#9a6a12; --red:#8a2f2b; --blue:#2c5a7a;
  }
  body { font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif; background:var(--paper);
         color:var(--ink); margin:0; padding:32px 24px; }
  .wrap { max-width:1000px; margin:0 auto; }
  h1 { font-size:22px; font-weight:600; margin:0 0 2px; }
  .meta { color:var(--soft); font-size:13px; margin-bottom:20px; }
  .tablewrap { overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:2px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th { text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
       color:var(--soft); padding:10px 14px; border-bottom:1px solid var(--ink); white-space:nowrap; }
  td { padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  code { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  a { color:var(--pine); }
  .pill { font-family:ui-monospace,Menlo,monospace; font-size:12px; padding:2px 9px;
          border-radius:10px; border:1px solid var(--line); color:var(--soft); white-space:nowrap; }
  .pill.running { border-color:var(--pine); color:var(--pine); background:#e7efec; }
  .pill.blocked { border-color:var(--amber); color:var(--amber); background:#f6efdd; }
  .pill.review  { border-color:var(--blue); color:var(--blue); background:#e7eef4; }
  .pill.done    { border-color:var(--pine); color:#fff; background:var(--pine); } /* v0.1, unused */
  .pill.failed  { border-color:var(--red); color:var(--red); background:#f5e7e6; }
  .pill.pending  { border-color:var(--line); color:var(--soft); background:#fff; }
  .pill.planned  { border-color:var(--blue); color:var(--blue); background:#fff; }   /* plan ready, awaiting founder go */
  .pill.executed { border-color:var(--pine); color:var(--pine); background:#fff; }   /* exec done, review spawning */
  .pill.rework   { border-color:var(--amber); color:var(--amber); background:#fff; } /* review findings bouncing to codex */
  .pill.accepted { border-color:var(--pine); color:#fff; background:var(--pine); }
  .scope { color:var(--soft); font-size:13px; max-width:26ch; }
  .foot { color:var(--soft); font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Orchestrator — Missions</h1>
  <p class="meta">updated {{DATE_TIME}} · source of truth: missions/*/state</p>
  <div class="tablewrap">
    <table>
      <thead>
        <tr><th>Mission</th><th>Ask</th><th>Repos</th><th>State</th><th>Links</th><th>Updated</th></tr>
      </thead>
      <tbody>
        <!-- ROWS -->
        <!-- pill class = state: pending|running|planned|executed|rework|blocked|review|accepted|failed -->
        <!-- row shape:
        <tr>
          <td><code>2026-07-11-cuff-retry</code></td>
          <td class="scope">Add retry logic to cuff sync</td>
          <td><code>daobrewAI</code> · <code>cuff-fw</code></td>
          <td><span class="pill running">running</span></td>
          <td><a href="missions/2026-07-11-cuff-retry/design.md">design</a> · <a href="missions/2026-07-11-cuff-retry/plan.md">plan</a> · <a href="missions/2026-07-11-cuff-retry/report.md">report</a></td>
          <td>2026-07-11 14:02</td>
        </tr>
        -->
      </tbody>
    </table>
  </div>
  <p class="foot">Read-only view regenerated by the orchestrator on every mission state change. Open BLOCKED/ANSWER files via each mission's folder.</p>
</div>
</body>
</html>
