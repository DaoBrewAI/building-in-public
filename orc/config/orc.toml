# orc/config/orc.toml
# [execution] 是执行阶段的参数：mission 进入 executing 时 orc 读一次，记进 exec-setup 事件，运行中的 mission 不受改动影响。
# [acceptance] 是验收阶段的参数：每次用到时读。
# 值都写成带引号的字符串（和 models.toml 一样，老版本 Python 的最小解析器只认字符串）。

[execution]
max_parallel             = "3"    # 同时运行的节点数上限
session_timeout_seconds  = "3600" # 执行会话的一轮（以及判断测试对错的评审会话）最多跑多少秒；超时按崩溃处理。按实测耗时调整
crash_retries            = "1"    # 执行会话崩溃（退出码非 0、进程不见了、超时）后重试几次，再失败节点进入 blocked

[acceptance]
required_checks          = "verify,exam" # 进入 accepted 前 PR 上必须通过的 CI 检查（GitHub 上显示的 job 名，逗号分隔）：northstar 的签名和验收检查、隐藏考题
ci_timeout_seconds       = "3600" # 等 PR 的 CI 最多多少秒；超时停下问用户
public_checks            = "verify" # required_checks 里哪些是公开的检查：失败日志交给诊断。没写在这里的一律当隐藏考题，输出全部丢掉，orc 只取 workflow 过滤后的「NORTHSTAR-EXAM N# fail」行（STATE.md「PR 和 CI」）
