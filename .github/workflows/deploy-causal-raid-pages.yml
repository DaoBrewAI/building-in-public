name: Deploy Causal Raid to Pages

on:
  push:
    branches:
      - main
    paths:
      - "causal-raid/**"
      - ".github/pages-index.html"
      - ".github/workflows/deploy-causal-raid-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: causal-raid/package-lock.json

      - name: Install dependencies
        working-directory: causal-raid
        run: npm ci

      - name: Typecheck
        working-directory: causal-raid
        run: npm run typecheck

      - name: Build
        working-directory: causal-raid
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Package Pages site
        run: |
          mkdir -p _site/causal-raid
          cp -R causal-raid/dist/. _site/causal-raid/
          cp .github/pages-index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
