# orc/config/models.toml
# 唯一写模型名的地方。skill、brief、脚本里只引用角色，不出现具体模型名。
# 选"最强"而不是"最新"：新模型发布后由你判断是否更强，再手动改这里。
# mission 开始时 orc 把这里解析出的模型记进 mission 状态，运行中的 mission 不受改动影响。
# 信任层安装时 install.sh 把这个文件复制成 /opt/northstar/models.toml，提交前的对齐评审按它选模型。

[implement]                       # 写代码、修复、rework
cli    = "claude"
model  = "claude-opus-5-5"
effort = "high"

[plan]                            # brainstorm、设计、计划、DAG
cli    = "claude"
model  = "claude-opus-5-5"
effort = "high"

[review]                          # 重要、复杂的评审：节点整体评审、最终审查、DRIFT 之后的复审、大改动
cli    = "claude"
model  = "claude-fable-5-1"
effort = "high"
deep_review_over_lines = "300"    # 单次提交改动（+/- 行）超过这么多行，也用这个角色
# 不设 fallback：这个模型不可用时 orc 停下来问你，绝不降级成 implement 的模型（不能自己审自己）

[review_light]                    # 其余每次提交前的小步对齐评审
cli    = "claude"
model  = "claude-opus-5-5"
effort = "high"
