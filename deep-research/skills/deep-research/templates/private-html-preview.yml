name: Private HTML Report

run-name: HTML preview · ${{ inputs.report_path }} @ ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      report_path:
        description: Repository-relative path to one canonical .html report
        required: true
        type: string
      source_ref:
        description: Branch, tag, or immutable commit containing the canonical HTML
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    name: Publish private mobile preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out report
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Validate canonical HTML report
        id: validate
        env:
          REPORT_PATH: ${{ inputs.report_path }}
          OUTPUT_DIR: ${{ runner.temp }}/private-html-report
        shell: bash
        run: |
          set -euo pipefail

          case "$REPORT_PATH" in
            /*|*".."*)
              echo "::error::report_path must stay inside the repository"
              exit 1
              ;;
            *.html) ;;
            *)
              echo "::error::report_path must identify one .html file"
              exit 1
              ;;
          esac

          if [[ ! -f "$REPORT_PATH" || -L "$REPORT_PATH" ]]; then
            echo "::error::report_path must be a regular committed HTML file"
            exit 1
          fi

          SOURCE_COMMIT="$(git rev-parse --verify HEAD)"
          export SOURCE_COMMIT
          mkdir -p "$OUTPUT_DIR"

          python3 - "$REPORT_PATH" "$OUTPUT_DIR" <<'PY'
          from __future__ import annotations

          import html
          import os
          import re
          import sys
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import quote, urlparse

          report_path = Path(sys.argv[1])
          output_dir = Path(sys.argv[2])
          repo_root = Path.cwd().resolve()
          source_placeholder = "__REPORT_SOURCE_URL__"
          graphify_template_id = "graphify-source"
          graphify_raw_limit = 20_000
          graphify_template_deadline = 16_000

          def contains_control_characters(value: str) -> bool:
              return any(ord(character) < 32 or ord(character) == 127 for character in value)

          def has_symlink_component(relative_path: Path) -> bool:
              candidate = repo_root
              for part in relative_path.parts:
                  candidate /= part
                  if candidate.is_symlink():
                      return True
              return False

          report_path_errors: list[str] = []
          if contains_control_characters(str(report_path)):
              report_path_errors.append("report_path contains control characters")
          try:
              report_path.resolve(strict=True).relative_to(repo_root)
          except (FileNotFoundError, ValueError):
              report_path_errors.append("report_path resolves outside the repository")
          if not report_path.is_absolute() and has_symlink_component(report_path):
              report_path_errors.append("report_path may not traverse symlinks")
          if report_path_errors:
              for error in sorted(set(report_path_errors)):
                  print(f"::error::{error}")
              raise SystemExit(1)

          class ReportParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.meta: dict[str, str] = {}
                  self.duplicate_meta: set[str] = set()
                  self.errors: list[str] = []
                  self.in_head = False
                  self.in_body = False
                  self.in_graphify_template = False
                  self.head_count = 0
                  self.body_count = 0
                  self.doctype_count = 0
                  self.seen_csp = False
                  self.seen_style = False
                  self.charset_values: list[str] = []
                  self.viewport_values: list[str] = []
                  self.graphify_template_count = 0
                  self.graphify_text: list[str] = []
                  self.source_placeholder_links = 0
                  self.ids: set[str] = set()
                  self.duplicate_ids: set[str] = set()

              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  tag = tag.lower()
                  values: dict[str, str] = {}
                  for raw_key, raw_value in attrs:
                      key = str(raw_key).lower()
                      if key in values:
                          self.errors.append(f"duplicate attribute {key} on <{tag}> is not allowed")
                          continue
                      values[key] = raw_value or ""

                  element_id = values.get("id", "")
                  if element_id:
                      if element_id in self.ids:
                          self.duplicate_ids.add(element_id)
                      self.ids.add(element_id)

                  if self.in_graphify_template:
                      self.errors.append(
                          f"graphify-source must be plain Markdown-like text; nested <{tag}> is not allowed"
                      )

                  if tag == "head":
                      self.head_count += 1
                      self.in_head = True
                  elif tag == "body":
                      self.body_count += 1
                      self.in_body = True
                      if not self.seen_csp:
                          self.errors.append("CSP meta must appear in <head> before <body>")

                  if not self.seen_csp:
                      if tag not in {"html", "head", "meta"}:
                          self.errors.append(f"<{tag}> is not allowed before the CSP meta")
                      if tag == "html":
                          unexpected = sorted(set(values) - {"lang", "dir"})
                          if unexpected:
                              self.errors.append(
                                  "unsupported pre-CSP <html> attributes: "
                                  + ", ".join(unexpected)
                              )
                      elif tag == "head" and values:
                          self.errors.append("<head> attributes are not allowed before CSP")
                      elif tag == "meta":
                          unexpected = sorted(
                              set(values) - {"charset", "name", "content", "http-equiv"}
                          )
                          if unexpected:
                              self.errors.append(
                                  "unsupported pre-CSP <meta> attributes: "
                                  + ", ".join(unexpected)
                              )
                          name = values.get("name", "").lower()
                          is_csp = (
                              values.get("http-equiv", "").lower()
                              == "content-security-policy"
                          )
                          allowed_name = name in {"viewport", "report-id"}
                          if not ("charset" in values or allowed_name or is_csp):
                              self.errors.append(
                                  "only charset, viewport, report-id, and CSP meta are allowed before CSP"
                              )

                  if tag == "meta":
                      if "charset" in values:
                          self.charset_values.append(values.get("charset", "").strip().lower())
                      name = values.get("name", "").lower()
                      if name == "viewport":
                          self.viewport_values.append(values.get("content", "").strip())
                      if name == "report-id":
                          if name in self.meta:
                              self.duplicate_meta.add(name)
                          self.meta[name] = values.get("content", "").strip()
                      if values.get("http-equiv", "").lower() == "content-security-policy":
                          if not self.in_head:
                              self.errors.append("CSP meta must be inside <head>")
                          if self.seen_csp:
                              self.duplicate_meta.add("content-security-policy")
                          if self.seen_style:
                              self.errors.append("CSP meta must appear before the first <style>")
                          self.seen_csp = True
                          self.meta["content-security-policy"] = values.get("content", "").strip()
                      if values.get("http-equiv", "").lower() == "refresh":
                          self.errors.append("meta refresh is not allowed")

                  if tag == "template":
                      if values.get("id") != graphify_template_id or set(values) != {"id"}:
                          self.errors.append(
                              "the only allowed template is <template id=\"graphify-source\">"
                          )
                      else:
                          self.graphify_template_count += 1
                          if not self.in_head:
                              self.errors.append("graphify-source template must be inside <head>")
                          if not self.seen_csp:
                              self.errors.append("graphify-source template must appear after CSP")
                          if self.seen_style:
                              self.errors.append(
                                  "graphify-source template must appear before the first <style>"
                              )
                          self.in_graphify_template = True

                  if tag in {"script", "form", "iframe", "object", "embed", "base", "area"}:
                      self.errors.append(f"<{tag}> is not allowed in a private report")
                  if tag == "link":
                      self.errors.append("<link> dependencies are not allowed")
                  if tag == "style":
                      if not self.seen_csp:
                          self.errors.append("CSP meta must appear before the first <style>")
                      if self.graphify_template_count != 1:
                          self.errors.append(
                              "the unique graphify-source template must appear before the first <style>"
                          )
                      self.seen_style = True

                  for key in values:
                      if key.startswith("on"):
                          self.errors.append(f"event handler attribute {key} is not allowed")
                  if "style" in values and not self.seen_csp:
                      self.errors.append("CSP meta must appear before inline style attributes")

                  if tag == "a":
                      href = values.get("href", "")
                      if "ping" in values:
                          self.errors.append("anchor ping is not allowed")
                      if href != href.strip() or contains_control_characters(href):
                          self.errors.append("anchor href contains whitespace or control characters")
                      parsed = urlparse(href)
                      requires_safe_rel = href == source_placeholder or parsed.scheme in {
                          "http",
                          "https",
                      }
                      if requires_safe_rel:
                          rel = set(values.get("rel", "").lower().split())
                          if not {"noopener", "noreferrer"}.issubset(rel):
                              self.errors.append(
                                  "external and report source links must use rel=\"noopener noreferrer\""
                              )
                      if href == source_placeholder:
                          self.source_placeholder_links += 1
                          if not self.in_body:
                              self.errors.append("report source placeholder link must be inside <body>")
                          if values.get("target", "").lower() != "_blank":
                              self.errors.append("report source placeholder must use target=\"_blank\"")
                      if href == source_placeholder or not href or href.startswith("#"):
                          pass
                      elif parsed.scheme in {"http", "https"}:
                          pass
                      elif parsed.scheme == "mailto":
                          pass
                      elif parsed.scheme:
                          self.errors.append(f"unsupported link scheme: {parsed.scheme}")
                      else:
                          self.errors.append(
                              "anchor href must be a fragment or an absolute http(s)/mailto URL"
                          )

                  if tag in {"img", "audio", "video", "source"}:
                      src = values.get("src", "")
                      if src and not src.startswith(("data:", "blob:")):
                          self.errors.append(f"external {tag} source is not allowed")
                      if values.get("srcset"):
                          self.errors.append(f"{tag} srcset is not allowed")
                  if tag == "video":
                      poster = values.get("poster", "")
                      if poster and not poster.startswith(("data:", "blob:")):
                          self.errors.append("external video poster is not allowed")
                  if tag != "a":
                      for key in ("href", "xlink:href"):
                          reference = values.get(key, "")
                          if reference and not reference.startswith(("#", "data:", "blob:")):
                              self.errors.append(f"external {tag} {key} is not allowed")

              def handle_endtag(self, tag: str) -> None:
                  tag = tag.lower()
                  if not self.seen_csp:
                      self.errors.append(f"closing tag </{tag}> is not allowed before CSP")
                  if self.in_graphify_template:
                      if tag == "template":
                          self.in_graphify_template = False
                      else:
                          self.errors.append(
                              f"graphify-source must be plain text; nested </{tag}> is not allowed"
                          )
                  elif tag == "template":
                      self.errors.append("unexpected closing </template>")
                  if tag == "head":
                      if self.in_graphify_template:
                          self.errors.append("graphify-source template is not closed")
                      self.in_head = False
                  elif tag == "body":
                      self.in_body = False

              def handle_data(self, data: str) -> None:
                  if not self.seen_csp and data.strip():
                      self.errors.append("non-whitespace text is not allowed before CSP")
                  if self.in_graphify_template:
                      self.graphify_text.append(data)

              def handle_decl(self, declaration: str) -> None:
                  self.doctype_count += 1
                  if declaration.strip().lower() != "doctype html":
                      self.errors.append("report must use the HTML5 doctype")

              def handle_pi(self, data: str) -> None:
                  self.errors.append("processing instructions are not allowed")

          raw = report_path.read_text(encoding="utf-8")
          parser = ReportParser()
          parser.feed(raw)
          parser.close()

          if parser.head_count != 1:
              parser.errors.append("report must contain exactly one <head>")
          if parser.body_count != 1:
              parser.errors.append("report must contain exactly one <body>")
          if parser.doctype_count != 1:
              parser.errors.append("report must contain exactly one HTML5 doctype")
          if parser.charset_values != ["utf-8"]:
              parser.errors.append("report must declare exactly one UTF-8 charset")
          if len(parser.viewport_values) != 1:
              parser.errors.append("report must declare exactly one viewport meta")
          elif not {
              part.strip().lower()
              for part in parser.viewport_values[0].split(",")
          }.issuperset({"width=device-width", "initial-scale=1"}):
              parser.errors.append(
                  "viewport must include width=device-width and initial-scale=1"
              )
          if parser.duplicate_ids:
              parser.errors.append("duplicate HTML ids: " + ", ".join(sorted(parser.duplicate_ids)))

          required = {"report-id", "content-security-policy"}
          missing = sorted(required - parser.meta.keys())
          if missing:
              parser.errors.append("missing metadata: " + ", ".join(missing))
          empty = sorted(
              key for key in required if key in parser.meta and not parser.meta[key].strip()
          )
          if empty:
              parser.errors.append("empty metadata: " + ", ".join(empty))
          if parser.duplicate_meta:
              parser.errors.append(
                  "duplicate metadata: " + ", ".join(sorted(parser.duplicate_meta))
              )

          report_id = parser.meta.get("report-id", "")
          if report_id and not re.fullmatch(r"[A-Za-z0-9._-]{3,128}", report_id):
              parser.errors.append("report-id contains unsupported characters")

          csp = parser.meta.get("content-security-policy", "")
          directives: dict[str, set[str]] = {}
          duplicate_directives: set[str] = set()
          for clause in csp.split(";"):
              parts = clause.strip().split()
              if parts:
                  directive = parts[0].lower()
                  if directive in directives:
                      duplicate_directives.add(directive)
                  directives[directive] = set(parts[1:])
          if duplicate_directives:
              parser.errors.append(
                  "duplicate CSP directives: " + ", ".join(sorted(duplicate_directives))
              )
          required_csp = {
              "default-src": {"'none'"},
              "script-src": {"'none'"},
              "connect-src": {"'none'"},
              "style-src": {"'unsafe-inline'"},
              "img-src": {"data:", "blob:"},
              "font-src": {"data:"},
              "media-src": {"data:", "blob:"},
              "worker-src": {"'none'"},
              "child-src": {"'none'"},
              "object-src": {"'none'"},
              "frame-src": {"'none'"},
              "manifest-src": {"'none'"},
              "base-uri": {"'none'"},
              "form-action": {"'none'"},
          }
          unexpected_directives = sorted(set(directives) - set(required_csp))
          if unexpected_directives:
              parser.errors.append(
                  "CSP contains unsupported directives: "
                  + ", ".join(unexpected_directives)
              )
          for directive, expected in required_csp.items():
              if directives.get(directive) != expected:
                  parser.errors.append(
                      f"CSP must set {directive} to {' '.join(sorted(expected))}"
                  )

          template_open = list(
              re.finditer(
                  r"<template\s+id\s*=\s*(['\"])graphify-source\1\s*>",
                  raw,
                  flags=re.IGNORECASE,
              )
          )
          template_close = list(
              re.finditer(r"</template\s*>", raw, flags=re.IGNORECASE)
          )
          if parser.graphify_template_count != 1 or len(template_open) != 1 or len(template_close) != 1:
              parser.errors.append(
                  "report must contain exactly one plain <template id=\"graphify-source\">"
              )
          else:
              csp_position = raw.lower().find("content-security-policy")
              style_match = re.search(r"<style(?:\s[^>]*)?>", raw, flags=re.IGNORECASE)
              if csp_position < 0 or not (
                  csp_position < template_open[0].start() < template_close[0].start()
              ):
                  parser.errors.append("graphify-source template must appear after CSP")
              if style_match is None:
                  parser.errors.append("report must contain inline presentation CSS")
              elif template_close[0].end() > style_match.start():
                  parser.errors.append(
                      "graphify-source template must close before the first <style>"
                  )
              if template_close[0].end() > graphify_template_deadline:
                  parser.errors.append(
                      "graphify-source template must close within the first "
                      f"{graphify_template_deadline} characters (Graphify cap: {graphify_raw_limit})"
                  )

          semantic_text = "".join(parser.graphify_text).strip()
          if len(semantic_text) < 200:
              parser.errors.append("graphify-source is too short to preserve key report semantics")
          required_headings = (
              "# Executive Summary",
              "# Conclusions",
              "# Decision Status",
              "# Sources",
          )
          for heading in required_headings:
              if not re.search(rf"(?m)^{re.escape(heading)}\s*$", semantic_text):
                  parser.errors.append(f"graphify-source missing required heading: {heading}")

          if raw.count(source_placeholder) != 1:
              parser.errors.append(
                  "report must contain exactly one __REPORT_SOURCE_URL__ placeholder"
              )
          if parser.source_placeholder_links != 1:
              parser.errors.append(
                  "report must use __REPORT_SOURCE_URL__ as exactly one body anchor href"
              )

          if parser.errors:
              for error in sorted(set(parser.errors)):
                  print(f"::error::{error}")
              raise SystemExit(1)

          source_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/blob/{os.environ['SOURCE_COMMIT']}/{quote(report_path.as_posix(), safe='/')}"
          )
          published = output_dir / report_path.name
          published.write_text(
              raw.replace(source_placeholder, html.escape(source_url, quote=True)),
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"published_path={published}\n")
              output.write(f"report_id={report_id}\n")
              output.write(f"source_url={source_url}\n")
              output.write(f"source_commit={os.environ['SOURCE_COMMIT']}\n")
          PY

      - name: Upload directly viewable HTML
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.validate.outputs.published_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Add private mobile link
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          REPORT_ID: ${{ steps.validate.outputs.report_id }}
          SOURCE_URL: ${{ steps.validate.outputs.source_url }}
          SOURCE_COMMIT: ${{ steps.validate.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          RETENTION_DAYS="${GITHUB_RETENTION_DAYS:-14}"
          if [[ ! "$RETENTION_DAYS" =~ ^[0-9]+$ ]]; then
            RETENTION_DAYS=90
          fi
          EXPIRES_ON="$(date -u -d "+${RETENTION_DAYS} days" +%Y-%m-%d)"
          {
            echo "## Private mobile report"
            echo
            echo "[Open the interactive HTML report]($ARTIFACT_URL)"
            echo
            echo "GitHub sign-in and repository read access are required."
            echo "Report: \`$REPORT_ID\`"
            echo "Committed source: [Open exact HTML]($SOURCE_URL)"
            echo "Commit: \`$SOURCE_COMMIT\`"
            echo "Expected retention through: \`$EXPIRES_ON\`"
          } >> "$GITHUB_STEP_SUMMARY"
